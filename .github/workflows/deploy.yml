name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_BACK_END_API_PREFIX=${{ secrets.VITE_BACK_END_API_PREFIX }} \
            --build-arg VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }} \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }} \
            --build-arg VITE_SKIP_BACKEND_IMAGES=${{ secrets.VITE_SKIP_BACKEND_IMAGES }} \
            -t ghcr.io/mudabs/ecommerce-frontend:latest .

      - name: Push Docker image
        run: docker push ghcr.io/mudabs/ecommerce-frontend:latest